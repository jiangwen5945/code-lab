<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/code-lab/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Lab</title>
    <style>
      #loading-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f8f8f8;
        z-index: 9999;
        display: grid;
        place-content: center;
        color: #333333;
      }

      #loading-progress .loading {
        width: 5rem;
        text-align: center;
        font-size: 0.88rem;
        font-weight: 400;
        position: relative;
        z-index: 2;
        font-family: 'Rajdhani', sans-serif;
      }

      #loading-progress .value {
        margin-right: 0.2rem;
        font-size: 1.3rem;
        font-weight: bold;
      }

      #loading-progress .progress {
        width: 0%;
        height: 2px;
        background-color: #333333;
        margin-top: 0.33rem;
        transition: 0.3s;
      }

      #loading-progress .progress::after {
        content: '';
        width: 100%;
        height: 2px;
        position: absolute;
        left: 0;
        z-index: -1;
        background-color: #dfdfdf;
      }
    </style>
    <script type="module" crossorigin src="/code-lab/assets/zendo-oqtfgXi4.js"></script>
    <link rel="modulepreload" crossorigin href="/code-lab/assets/index-U0iYpxnc.js">
    <link rel="stylesheet" crossorigin href="/code-lab/assets/index-CbY0DLY6.css">
    <link rel="stylesheet" crossorigin href="/code-lab/assets/zendo-CAB_1Bz4.css">
  </head>

  <body>
    <div id="app">
      <div id="loading-progress">
        <div class="loading">
          <div><span class="value">0</span>%</div>
          <div class="progress"></div>
        </div>
      </div>
    </div>
  </body>

  <script src="/code-lab/nprogress.js"></script>
  <script>
    window.NProgress = NProgress
    window.NProgress.configure({ showSpinner: false }) // NProgress Configuration
    window.NProgress.start()
    window.NProgress.inc(0.8)
    const elValue = document.querySelector('#loading-progress .value')
    const elProgress = document.querySelector('#loading-progress .progress')
    window.NProgressTimer = setInterval(() => {
      let value = Math.floor(window.NProgress.status * 100)
      elValue.innerHTML = value
      elProgress.style.width = value + '%'
    }, 100)
    window.NProgress.close = () => {
      return new Promise((resolve) => {
        setTimeout(() => {
          elValue.innerHTML = 100
          elProgress.style.width = 100 + '%'
          window.NProgress.done()
          clearInterval(window.NProgressTimer)
          // 防止app挂载过快导致没有加载到100%的进度
          setTimeout(() => {
            resolve()
          }, 300)
          // 默认给一个0.5s的延迟，主要是为了实现效果
        }, 500)
      })
    }
  </script>
</html>
